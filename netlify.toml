[build]
  publish = "public"
  functions = "netlify/functions"

# O frontend chama /api/... — este redirect encaminha para as Netlify Functions.
# Sem este bloco, todas as chamadas /api/* retornam 404 e os seletores ficam vazios.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
